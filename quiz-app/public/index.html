<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Cert Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
  <main style="display:flex; justify-content:center; align-items:center; min-height:80vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
      <h2 style="text-align:center; color:var(--salmon); margin-bottom:1.5rem;">AWS Cert Practice</h2>
      <div style="text-align:center; padding: 2rem 0;">
        <button id="login-btn" style="width: 100%; padding: 1rem; font-size: 1.1rem; background-color: var(--salmon); color: var(--bg-primary); font-weight: 600; border-radius: var(--radius);">
          Login via DarwinIdP
        </button>
      </div>
      <div id="error-msg" style="color:var(--incorrect); margin-top:1rem; text-align:center; font-size:0.9rem;"></div>
    </div>
  </main>
  <script type="module" src="js/auth.js?v=3"></script>
</body>
</html>
